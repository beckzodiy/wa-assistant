name: Build debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # Retry once: Maven Central sometimes rate-limits CI runners (HTTP 429).
        run: ./gradlew assembleDebug --no-daemon || (sleep 30 && ./gradlew assembleDebug --no-daemon --stacktrace)

      - uses: actions/upload-artifact@v4
        with:
          name: wa-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
